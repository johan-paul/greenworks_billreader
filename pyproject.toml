[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electricity-bill-intelligence"
version = "0.1.0"
description = "Offline Ollama electricity bill extraction and transparent energy scenarios"
requires-python = ">=3.11"
dependencies = ["PyMuPDF>=1.24,<2", "pydantic>=2.8,<3", "Flask>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
billintel = "billintel.cli:main"

[tool.setuptools.packages.find]
include = ["billintel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
billintel = ["web/*.html", "web/*.css", "web/*.js"]
